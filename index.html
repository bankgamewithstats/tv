<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1e4a" />
  <title>Bank Game — Live Leaderboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Confetti lives at body level so it isn't a flex child of any screen -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Idle/waiting state -->
  <div id="waiting-screen" class="screen">
    <div class="logo-corner">
      <img src="logo.png" alt="Bank" class="logo-img" />
    </div>
    <div class="waiting-content">
      <div class="waiting-title">Bank Game with Stats</div>
      <div class="waiting-subtitle">Waiting for game...</div>
    </div>
  </div>

  <!-- End screen -->
  <div id="end-screen" class="screen hidden">
    <div class="logo-corner">
      <img src="logo.png" alt="Bank" class="logo-img" />
    </div>
    <div class="end-wrapper">
      <div class="winner-banner">
        <span class="winner-trophy">🏆</span>
        <span class="winner-name-text" id="winner-name-text">Game Over</span>
      </div>
      <div class="end-body">
        <div class="end-left">
          <div class="end-section-title">Final Standings</div>
          <div id="end-players-list"></div>
        </div>
        <div class="end-right">
          <div class="end-section-title">Player Awards</div>
          <div class="stats-grid" id="stat-player-awards"></div>
          <div class="end-section-title">Dice &amp; Rolls</div>
          <div class="stats-grid" id="stat-dice-rolls"></div>
          <div class="end-section-title">Game Records</div>
          <div class="stats-grid" id="stat-game-records"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Live leaderboard -->
  <div id="game-screen" class="screen hidden">
    <header class="game-header">
      <div class="round-info">
        <div class="round-display" id="round-display">Round 1 / 10</div>
        <div class="round-phase" id="round-phase"></div>
      </div>
      <span class="pot-value" id="pot-value">0</span>
      <div class="header-logo">
        <img src="logo.png" alt="Bank" class="logo-img" />
      </div>
    </header>
    <main class="leaderboard" id="players-list"></main>
  </div>

  <!-- Round transition overlay — shown briefly when a new round starts -->
  <div id="round-overlay" class="round-overlay hidden">
    <div class="round-overlay-text" id="round-overlay-text">Round 1</div>
  </div>

  <!-- Resolution debug overlay — remove before shipping -->
  <div id="resolution-display" style="position:fixed;bottom:8px;right:12px;font-size:11px;color:rgba(255,255,255,0.35);z-index:9999;font-family:monospace;pointer-events:none;"></div>

  <!-- Google Cast Receiver SDK — no-op in non-Cast browsers -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    // Initialize Cast receiver if running inside Chromecast
    // When the app sends a room code via the custom message channel,
    // we reload with ?code= so the Firebase listener picks it up.
    if (window.cast && cast.framework) {
      const context = cast.framework.CastReceiverContext.getInstance();
      const options = new cast.framework.CastReceiverOptions();
      // CRITICAL: disableIdleTimeout prevents receiver closing mid-game
      // (default: Cast closes after ~5 min with no media activity)
      options.disableIdleTimeout = true;

      context.addCustomMessageListener('urn:x-cast:com.bank.roomcode', (event) => {
        try {
          const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
          const roomCode = data?.roomCode;
          if (roomCode && new URLSearchParams(window.location.search).get('code') !== roomCode) {
            window.location.replace(window.location.pathname + '?code=' + encodeURIComponent(roomCode));
          }
        } catch {
          // malformed message — ignore
        }
      });

      context.start(options);
    }
  </script>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js';
    import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js';

    // Firebase config — security via rules, not key secrecy (standard Firebase practice)
    const firebaseConfig = {
      apiKey: "AIzaSyDkqm3qDC50wcvNOtdL7X2ocKImMpFTYR0",
      authDomain: "bank-game-with-stats.firebaseapp.com",
      databaseURL: "https://bank-game-with-stats-default-rtdb.firebaseio.com",
      projectId: "bank-game-with-stats",
      storageBucket: "bank-game-with-stats.appspot.com",
      messagingSenderId: "333591070423",
      appId: "1:333591070423:web:ab922405955584dfb39292"
    };

    // Resolution debug display
    const resEl = document.getElementById('resolution-display');
    function updateResDisplay() {
      const sw = window.screen.width, sh = window.screen.height;
      const vw = window.innerWidth, vh = window.innerHeight;
      const dpr = window.devicePixelRatio || 1;
      const fs = parseFloat(getComputedStyle(document.documentElement).fontSize);
      resEl.textContent = `screen ${sw}×${sh}  viewport ${vw}×${vh}  dpr ${dpr}  1rem=${fs.toFixed(1)}px`;
    }
    updateResDisplay();
    window.addEventListener('resize', updateResDisplay);

    const code = new URLSearchParams(window.location.search).get('code');

    const waitingScreen = document.getElementById('waiting-screen');
    const gameScreen = document.getElementById('game-screen');
    const endScreen = document.getElementById('end-screen');
    const roundDisplay = document.getElementById('round-display');
    const potValue = document.getElementById('pot-value');
    const playersList = document.getElementById('players-list');

    function showWaiting() {
      waitingScreen.classList.remove('hidden');
      gameScreen.classList.add('hidden');
      endScreen.classList.add('hidden');
      stopConfetti();
      stopScrollLoop();
    }

    function showGame() {
      waitingScreen.classList.add('hidden');
      gameScreen.classList.remove('hidden');
      endScreen.classList.add('hidden');
      stopConfetti();
      stopScrollLoop();
    }

    function showEnd() {
      waitingScreen.classList.add('hidden');
      gameScreen.classList.add('hidden');
      endScreen.classList.remove('hidden');
      startConfetti();
    }

    function formatScore(n) {
      return n.toLocaleString();
    }

    // Track previous state for change detection
    const prevBankedState = {};
    let prevRound = null;

    function showRoundTransition(roundNum, totalRounds) {
      const overlay = document.getElementById('round-overlay');
      const overlayText = document.getElementById('round-overlay-text');
      const isFinal = roundNum === totalRounds;
      overlayText.textContent = isFinal ? 'Final Round' : `Round ${roundNum}`;
      overlay.classList.remove('hidden', 'fade-out');
      overlay.classList.add('fade-in');
      setTimeout(() => {
        overlay.classList.remove('fade-in');
        overlay.classList.add('fade-out');
        setTimeout(() => overlay.classList.add('hidden'), 600);
      }, 2200);
    }

    function renderLeaderboard(state) {
      // Show game screen
      showGame();

      // Scale leaderboard based on player count — never let players go off screen
      const count = state.players.length;
      const cols = count > 20 ? 3 : count > 10 ? 2 : 1;
      const sizeClass = count > 20 ? ' lb-xl' : count > 10 ? ' lb-large' : '';
      gameScreen.className = `screen${sizeClass}`;

      // Round transition: fire overlay when round number changes
      if (prevRound !== null && state.currentRound !== prevRound) {
        showRoundTransition(state.currentRound, state.totalRounds);
      }
      prevRound = state.currentRound;

      // Round display + opening phase badge
      roundDisplay.textContent = `Round ${state.currentRound} / ${state.totalRounds}`;
      const phaseEl = document.getElementById('round-phase');
      if (phaseEl) {
        const isOpening = (state.rollCount ?? 0) < 3;
        phaseEl.textContent = isOpening ? 'Opening' : '';
        phaseEl.style.display = isOpening ? '' : 'none';
      }

      // Pot display
      potValue.textContent = formatScore(state.pot);

      // Sort players by score descending
      const sorted = [...state.players].sort((a, b) => b.score - a.score);

      // Apply column-flow layout after rendering so items read top→bottom in
      // each column rather than left→right across rows.
      // grid-auto-flow:column + explicit row count achieves this.
      if (cols > 1) {
        const rows = Math.ceil(count / cols);
        playersList.style.display = 'grid';
        playersList.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        playersList.style.gridTemplateRows = `repeat(${rows}, auto)`;
        playersList.style.gridAutoFlow = 'column';
        playersList.style.gap = '0.4rem 1rem';
        playersList.style.alignContent = 'start';
        playersList.style.zoom = '';
      } else {
        playersList.style.cssText = '';
      }

      playersList.innerHTML = sorted.map((player, idx) => {
        const isCurrentPlayer = state.players[state.currentPlayerIndex]?.id === player.id && !player.isBanked;
        const justBanked = !prevBankedState[player.id] && player.isBanked;

        let rowClass = 'player-row';
        if (player.isBanked) rowClass += ' banked';
        if (isCurrentPlayer) rowClass += ' current';
        if (justBanked) rowClass += ' just-banked';

        const lockIcon = player.isBanked ? '<span class="lock-icon">&#x1F512;</span>' : '';
        const currentArrow = isCurrentPlayer ? '<span class="current-arrow">&#x25B6;</span>' : '';
        const rank = idx + 1;

        return `
          <div class="${rowClass}" data-id="${player.id}">
            <span class="rank">${rank}</span>
            <span class="player-name">${escapeHtml(player.name)} ${lockIcon}</span>
            <span class="player-score">${formatScore(player.score)} ${currentArrow}</span>
          </div>
        `;
      }).join('');

      // Dynamic zoom for single-column: scale rows so all players always fit on screen.
      // zoom affects layout (unlike transform:scale), so padding/text all shrink proportionally.
      if (cols === 1) {
        requestAnimationFrame(() => {
          const available = playersList.clientHeight;
          const natural = playersList.scrollHeight;
          if (natural > available && available > 0) {
            // 0.97 buffer so the last row isn't flush against the bottom
            playersList.style.zoom = String((available / natural) * 0.97);
          }
        });
      }

      // Update previous banked state tracking
      state.players.forEach(p => {
        prevBankedState[p.id] = p.isBanked;
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    function statCard(label, value, description) {
      return `
        <div class="stat-card-tv">
          <div class="stat-card-label">${label}</div>
          <div class="stat-card-value">${escapeHtml(value ?? 'No data')}</div>
          <div class="stat-card-desc">${description}</div>
        </div>`;
    }

    function renderEndScreen(state) {
      showEnd();

      // Winner banner
      const names = state.winnerNames ?? [];
      document.getElementById('winner-name-text').textContent =
        names.length === 1 ? `${names[0]} Wins!` :
        names.length > 1  ? `It's a Tie! — ${names.join(' & ')}` :
        'Game Over';

      // Final standings
      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      document.getElementById('end-players-list').innerHTML = sorted.map((p, i) => {
        const isWinner = names.includes(p.name);
        return `
          <div class="end-player-row ${isWinner ? 'end-player-winner' : ''}">
            <span class="end-rank">${i + 1}</span>
            <span class="end-player-name">${escapeHtml(p.name)}</span>
            <span class="end-score">${formatScore(p.score)}</span>
          </div>`;
      }).join('');

      const s = state.stats;
      if (!s) return;

      document.getElementById('stat-player-awards').innerHTML = [
        statCard('Most Greedy Turn',
          s.mostGreedy ? `${s.mostGreedy.playerName ?? 'Unknown'} — ${s.mostGreedy.rollCount ?? '?'} rolls after others banked (Rd ${s.mostGreedy.roundNumber ?? '?'})` : null,
          'Kept rolling after everyone else already banked.'),
        statCard('Best Banker',
          s.bestBanker ? `${s.bestBanker.playerName} — avg ${formatScore(s.bestBanker.avgAmount)} pts` : null,
          'Highest average points per successful bank.'),
        statCard('Early Cash-Out',
          s.earlyCashOut ? `${s.earlyCashOut.playerName} — avg ${s.earlyCashOut.avgRolls} rolls/round` : null,
          'Banked the earliest on average — cautious and smart.'),
        statCard('Perfect Timing',
          s.perfectTiming ? `${s.perfectTiming.playerName} — ${s.perfectTiming.count}x (best ${formatScore(s.perfectTiming.bestAmount)} pts)` : null,
          'Banked on the very last roll before a 7 crashed.'),
        statCard('Biggest Bank',
          s.biggestBank ? `${s.biggestBank.playerName} — ${formatScore(s.biggestBank.amount)} pts (Rd ${s.biggestBank.roundNumber})` : null,
          'Single largest bank of the entire game.'),
      ].join('');

      document.getElementById('stat-dice-rolls').innerHTML = [
        statCard('Ruler of the Sevens',
          s.rulerOfSevens ? `${s.rulerOfSevens.playerName} — ${s.rulerOfSevens.sevenCount} sevens` : null,
          'Rolled the most 7s — safe ones and busts included.'),
        statCard('Most Doubles',
          s.mostDoubles ? `${s.mostDoubles.playerName} — ${s.mostDoubles.doubleCount} doubles` : null,
          'Rolled the most doubles — each one doubled the pot.'),
        statCard('Most Active Roller',
          s.mostActive ? `${s.mostActive.playerName} — ${s.mostActive.rollCount} rolls` : null,
          'Rolled the dice the most times across the whole game.'),
        statCard('Most Common Number',
          s.mostCommonNumber ? `${s.mostCommonNumber.total} — ${s.mostCommonNumber.count} times` : null,
          'The dice total that came up most often.'),
      ].join('');

      document.getElementById('stat-game-records').innerHTML = [
        statCard('Biggest Missed Opportunity',
          s.closestCall ? `Round ${s.closestCall.roundNumber} — ${formatScore(s.closestCall.potAmount)} pts wiped` : null,
          'Highest pot sitting in the bank when a 7 wiped it.'),
        statCard('Longest Round',
          s.wildestRound ? `Round ${s.wildestRound.roundNumber} — ${s.wildestRound.rollCount} rolls` : null,
          'The round with the most total dice rolls.'),
      ].join('');

      requestAnimationFrame(() => {
        // Left panel: auto-scroll standings if more players than fit
        const endLeft = document.querySelector('.end-left');
        if (endLeft) {
          endLeft.scrollTop = 0;
          if (endLeft.scrollHeight > endLeft.clientHeight + 4) {
            autoScrollLoop(endLeft);
          }
        }

        // Right panel: zoom to fill available height (scales up or down as needed)
        const endRight = document.querySelector('.end-right');
        if (endRight && window.innerWidth >= 700) {
          endRight.style.zoom = ''; // clear first so scrollHeight reflects natural size
          const ratio = endRight.clientHeight / endRight.scrollHeight;
          if (Math.abs(ratio - 1) > 0.02) { // skip if already ~fits
            endRight.style.zoom = String(ratio * 0.97);
          }
        }
      });
    }

    // ---- End-screen player list auto-scroll ----
    // Smoothly scrolls the standings list down then back up on repeat,
    // so a TV viewer never misses players that don't fit on screen.

    // Tracks active scroll loops per element so multiple panels can scroll independently
    const activeScrollLoops = new Map();

    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    }

    function autoScrollLoop(el) {
      if (activeScrollLoops.has(el)) cancelAnimationFrame(activeScrollLoops.get(el));

      const SCROLL_MS  = 10000; // time to scroll full list top→bottom
      const PAUSE_MS   = 2000;  // pause at each end

      let phase = 'pause-top';
      let phaseStart = null;

      function tick(ts) {
        if (!phaseStart) phaseStart = ts;
        const elapsed  = ts - phaseStart;
        const maxScroll = el.scrollHeight - el.clientHeight;
        if (maxScroll <= 0) return; // fits on screen — nothing to do

        if (phase === 'pause-top') {
          el.scrollTop = 0;
          if (elapsed >= PAUSE_MS) { phase = 'down'; phaseStart = ts; }
        } else if (phase === 'down') {
          const t = Math.min(elapsed / SCROLL_MS, 1);
          el.scrollTop = maxScroll * easeInOut(t);
          if (t >= 1) { phase = 'pause-bottom'; phaseStart = ts; }
        } else if (phase === 'pause-bottom') {
          el.scrollTop = maxScroll;
          if (elapsed >= PAUSE_MS) { phase = 'up'; phaseStart = ts; }
        } else if (phase === 'up') {
          const t = Math.min(elapsed / SCROLL_MS, 1);
          el.scrollTop = maxScroll * (1 - easeInOut(t));
          if (t >= 1) { phase = 'pause-top'; phaseStart = ts; }
        }

        activeScrollLoops.set(el, requestAnimationFrame(tick));
      }

      activeScrollLoops.set(el, requestAnimationFrame(tick));
    }

    function stopScrollLoop() {
      for (const rafId of activeScrollLoops.values()) cancelAnimationFrame(rafId);
      activeScrollLoops.clear();
    }

    // ---- Confetti ----
    const confettiCanvas = document.getElementById('confetti-canvas');
    const ctx = confettiCanvas.getContext('2d');
    let confettiPieces = [];
    let confettiRunning = false;
    let confettiRaf = null;

    const COLORS = ['#cb9a45', '#ffffff', '#4caf50', '#2196f3', '#e91e63', '#ff9800'];

    function resizeConfetti() {
      confettiCanvas.width = confettiCanvas.offsetWidth;
      confettiCanvas.height = confettiCanvas.offsetHeight;
    }

    function spawnConfetti(count) {
      const w = confettiCanvas.width;
      for (let i = 0; i < count; i++) {
        confettiPieces.push({
          x: Math.random() * w,
          y: -10 - Math.random() * 120,
          w: 4 + Math.random() * 4,
          h: 5 + Math.random() * 4,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          angle: Math.random() * Math.PI * 2,
          spin: (Math.random() - 0.5) * 0.15,
          vx: (Math.random() - 0.5) * 1.5,
          vy: 1.5 + Math.random() * 2.5,
          opacity: 1,
        });
      }
    }

    function tickConfetti() {
      const h = confettiCanvas.height;
      const w = confettiCanvas.width;
      ctx.clearRect(0, 0, w, h);

      confettiPieces = confettiPieces.filter(p => p.y < h + 20);

      for (const p of confettiPieces) {
        p.x += p.vx;
        p.y += p.vy;
        p.angle += p.spin;
        p.vx += (Math.random() - 0.5) * 0.1; // gentle drift

        ctx.save();
        ctx.globalAlpha = p.opacity;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }

      // Keep spawning while running
      if (confettiRunning && confettiPieces.length < 60) spawnConfetti(1);

      confettiRaf = requestAnimationFrame(tickConfetti);
    }

    function startConfetti() {
      confettiPieces = [];
      confettiRunning = true;
      confettiCanvas.style.display = 'block';
      // Defer resize until after the browser reflows the newly-visible canvas
      requestAnimationFrame(() => {
        resizeConfetti();
        spawnConfetti(50); // initial burst — smaller than before
        if (!confettiRaf) tickConfetti();
      });
    }

    function stopConfetti() {
      confettiRunning = false;
      // Let existing pieces fall off naturally, then hide canvas
      setTimeout(() => {
        cancelAnimationFrame(confettiRaf);
        confettiRaf = null;
        ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        confettiPieces = [];
        confettiCanvas.style.display = 'none';
      }, 4000);
    }

    window.addEventListener('resize', () => { if (confettiRunning) resizeConfetti(); });

    // ---- End ----

    if (!code) {
      showWaiting();
    } else {
      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      onValue(ref(db, `rooms/${code}`), (snapshot) => {
        const data = snapshot.val();
        if (!data || data.gamePhase === 'setup') {
          showWaiting();
        } else if (data.gamePhase === 'game-over') {
          renderEndScreen(data);
        } else {
          renderLeaderboard(data);
        }
      });
    }
  </script>
</body>
</html>
